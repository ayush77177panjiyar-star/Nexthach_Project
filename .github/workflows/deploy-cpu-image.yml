name: Build and Publish CPU Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.cpu"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "whisperlivekit/**"
      - ".github/workflows/deploy-cpu-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push CPU Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase repository owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          build-args: |
            EXTRAS=cpu
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/whisperlivekit:latest
            ghcr.io/${{ steps.owner.outputs.value }}/whisperlivekit:cpu-latest
            ghcr.io/${{ steps.owner.outputs.value }}/whisperlivekit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Hook (Optional)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
